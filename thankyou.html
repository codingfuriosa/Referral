<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You | The Jain Group</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#071C35;
    --green-2:#0c2a4d;
    --green-3:#05101f;
    --accent:#caa96a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;color:#fff;min-height:100vh;
    display:grid;place-items:center;text-align:center;padding:24px;
    background:radial-gradient(900px 500px at 50% 0,rgba(202,169,106,.16),transparent 60%),
               linear-gradient(160deg,var(--green-2) 0%,var(--green) 55%,var(--green-3) 100%);
    animation:fadeIn .6s ease both;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .ty-inner{max-width:560px;animation:tyPop .7s cubic-bezier(.2,.8,.2,1) .1s both}
  @keyframes tyPop{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
  .ty-logo{height:clamp(74px,11vw,104px);width:auto;filter:brightness(0) invert(1);margin:0 auto 34px;display:block}
  .ty-check{
    width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin:0 auto 30px;
    background:rgba(202,169,106,.14);border:2px solid var(--accent);
  }
  .ty-check svg{
    width:50px;height:50px;stroke:var(--accent);stroke-width:2.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;
    animation:tyDraw .6s ease .25s forwards;
  }
  @keyframes tyDraw{to{stroke-dashoffset:0}}
  h1{font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(40px,7vw,68px);line-height:1.05;letter-spacing:-1px;margin-bottom:18px}
  h1 em{font-style:normal;color:var(--accent)}
  p{color:#d3ddd6;font-size:clamp(15px,1.8vw,18px);font-weight:300;max-width:460px;margin:0 auto 36px}
  .btn-back{
    display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:15px;
    padding:15px 36px;border-radius:50px;background:var(--accent);color:var(--green-3);border:none;
    transition:transform .25s,box-shadow .25s;box-shadow:0 14px 30px rgba(0,0,0,.25);text-decoration:none;
  }
  .btn-back:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(0,0,0,.32)}
</style>
</head>
<body>
  <div class="ty-inner">
    <img class="ty-logo" src="img.png" alt="The Jain Group" />
    <div class="ty-check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Thank <em>You!</em></h1>
    <p>Your referral has been submitted successfully. Our team will reach out shortly to take it forward.</p>
    <a class="btn-back" href="referral.html">Submit Another Referral</a>
  </div>
</body>
</html>
